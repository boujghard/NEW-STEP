<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chika Kids - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Chika Kids</h1>

    <div class="subtitle">
        تسجيل دخول المسؤول
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">اسم المستخدم</label>

            <input
                type="text"
                id="username"
                placeholder="admin"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>

            <input
                type="password"
                id="password"
                placeholder="كلمة المرور"
                required
            >
        </div>

        <button type="submit">
            تسجيل الدخول
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    message.textContent = "جاري تسجيل الدخول...";

    try {

        const response = await fetch(
            "http://localhost:5000/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            message.textContent =
                data.message || "فشل تسجيل الدخول";

            return;
        }

        localStorage.setItem(
            "adminToken",
            data.token
        );

        message.textContent =
            "تم تسجيل الدخول بنجاح ✅";

        setTimeout(function () {

            window.location.href =
                "admin-dashboard.html";

        }, 800);

    } catch (error) {

        console.error("Login error:", error);

        message.textContent =
            "تعذر الاتصال بالخادم";

    }

});

</script>

</body>
</html>
